# Builds an unsigned RNDIS-only kext. Publishing a GitHub Release triggers a
# fresh build from its tag and attaches a ZIP and SHA-256 checksum to it.
# Hosted runners compile only: they cannot validate kext loading or hardware.
name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# Checkout and builds need read access; only the release upload job can write.
permissions:
  contents: read

jobs:
  build-kext:
    name: Build and verify kext
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - name: Show build environment
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Build Release and Debug
        shell: bash
        run: |
          set -euo pipefail
          for configuration in Release Debug; do
            xcodebuild -project HoRNDIS.xcodeproj \
              -target HoRNDIS \
              -configuration "$configuration" \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              ARCHS='x86_64 arm64e' \
              SDKROOT=macosx \
              MACOSX_DEPLOYMENT_TARGET=10.13 \
              build
          done

      - name: Verify both products
        shell: bash
        run: |
          set -euo pipefail
          for configuration in Release Debug; do
            kext="build/$configuration/HoRNDIS.kext"
            binary="$kext/Contents/MacOS/HoRNDIS"
            test -f "$binary"
            plutil -lint "$kext/Contents/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$kext/Contents/Info.plist")" = 'com.joshuawise.kexts.HoRNDIS'
            for arch in x86_64 arm64e; do
              lipo "$binary" -verify_arch "$arch"
            done
            echo "$configuration architectures: $(lipo -archs "$binary")"
            dwarfdump --uuid "$binary"
          done

      - name: Package release and debug archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for configuration in Release Debug; do
            stage="dist/HoRNDIS-$configuration"
            mkdir -p "$stage"
            ditto "build/$configuration/HoRNDIS.kext" "$stage/HoRNDIS.kext"
            cat > "$stage/RELEASE-NOTES.txt" <<'EOF'
          HoRNDIS RNDIS-only experimental build

          This kernel extension is unsigned and not notarized. It may be blocked
          by macOS security policy; installing or loading it can interrupt
          networking or cause a kernel panic. Do not weaken security settings
          solely to load this build. Back up an existing working driver first.

          CI checks compilation and archive integrity only. Loading, hardware
          compatibility, hotplug, suspend, and recovery are not verified by CI.
          x86_64 and arm64e slices do not imply Apple Silicon support. The driver
          supports RNDIS only, not CDC-NCM. No installer or installation script
          is included.
          EOF
            ditto -c -k --sequesterRsrc --keepParent "$stage" "dist/HoRNDIS-$configuration.zip"
            unzip -t "dist/HoRNDIS-$configuration.zip"
          done
          (cd dist && shasum -a 256 HoRNDIS-Release.zip HoRNDIS-Debug.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoRNDIS-unsigned-kext
          path: |
            dist/HoRNDIS-Release.zip
            dist/HoRNDIS-Debug.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    name: Attach assets to published release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-kext
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build assets
        uses: actions/download-artifact@v4
        with:
          name: HoRNDIS-unsigned-kext
          path: dist

      - name: Verify archive checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            dist/HoRNDIS-Release.zip dist/HoRNDIS-Debug.zip dist/SHA256SUMS.txt
