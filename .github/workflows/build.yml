# Builds the kext on macOS CI so that every push gets a compile check
# without needing a local Mac.
#
# A single arm64 runner (macos-14) is enough: with ONLY_ACTIVE_ARCH=NO the
# build is universal (x86_64 + arm64e slices in one kext), so the artifact
# works on both Intel and Apple Silicon Macs. (macos-13 Intel runners are
# being retired by GitHub and sit in the queue for hours; they add no
# coverage since x86_64 is cross-compiled on macos-14 anyway.)
#
# NOTE: GitHub-hosted macOS runners run with SIP enabled, so the kext
# cannot be *loaded* here - this pipeline verifies that it BUILDS and
# links against the kernel KPIs. Runtime verification happens on a real
# Mac (see README "Verifying a build").

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-kext:
    name: Build (macos-14, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build the kext (Release)
        run: |
          xcodebuild -project HoRNDIS.xcodeproj \
            -target HoRNDIS \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SDKROOT=macosx \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            build

      - name: Build the kext (Debug, verbose packet logs)
        run: |
          xcodebuild -project HoRNDIS.xcodeproj \
            -target HoRNDIS \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SDKROOT=macosx \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            build

      - name: Stage the debug kext
        run: |
          rm -rf HoRNDIS-debug.kext
          cp -R build/Debug/HoRNDIS.kext HoRNDIS-debug.kext

      - name: Upload the debug kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoRNDIS-kext-debug
          path: HoRNDIS-debug.kext
          if-no-files-found: error

      - name: Verify the product
        run: |
          ls -la build/Release/HoRNDIS.kext
          # Print the KPI libraries the kext links against:
          /usr/sbin/kextlibs -xml build/Release/HoRNDIS.kext | head -40

      - name: Link-check without loading (informational)
        run: |
          /usr/sbin/kextutil -n build/Release/HoRNDIS.kext || \
            echo "link-check skipped: expected on CI (unsigned kext + SIP enabled runner)"

      - name: Stage the kext for upload
        run: |
          rm -rf HoRNDIS.kext
          cp -R build/Release/HoRNDIS.kext .

      - name: Upload the kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoRNDIS-kext
          path: HoRNDIS.kext
          if-no-files-found: error
